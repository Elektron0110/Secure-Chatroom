<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Push Уведомления</title>
</head>
<body>
    <h1>Подписка на уведомления</h1>
    <button id="notifyBtn">Разрешить уведомления</button>

    <script>
        const vapidPublicKey = "{{ vapid_public_key }}";
        console.log("VAPID Public Key:", vapidPublicKey);

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/\-/g, '+')
                .replace(/_/g, '/');
            const rawData = atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        let swReadyPromise;

        if ('serviceWorker' in navigator && 'PushManager' in window) {
            swReadyPromise = navigator.serviceWorker.register('/static/service-worker.js', { scope: '/' })
                .then(function(registration) {
                    console.log('Service Worker зарегистрирован.', registration.scope);
                })
                .then(function() {
                    return navigator.serviceWorker.ready;
                })
                .then(function(serviceWorkerRegistration) {
                    console.log('Service Worker готов к работе.');
                    return serviceWorkerRegistration;
                })
                .catch(err => {
                    console.error('Ошибка при регистрации или ожидании SW:', err);
                });
        }

        document.getElementById('notifyBtn').addEventListener('click', function() {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    console.log('Разрешение на уведомления получено.');
                    if (swReadyPromise) {
                        swReadyPromise.then(serviceWorkerRegistration => {
                            if (!serviceWorkerRegistration) {
                                console.error('Service Worker не готов.');
                                return;
                            }
                            subscribeToPush(serviceWorkerRegistration);
                        });
                    }
                } else {
                    alert('Разрешение на уведомления не получено.');
                }
            });
        });

        function subscribeToPush(serviceWorkerRegistration) {
            const applicationServerKey = urlBase64ToUint8Array(vapidPublicKey);
            console.log("Application Server Key:", applicationServerKey); // Отладка

            const options = {
                userVisibleOnly: true,
                applicationServerKey: applicationServerKey
            };

            serviceWorkerRegistration.pushManager.subscribe(options)
                .then(function(subscription) {
                    console.log('Подписка создана:', subscription);

                    fetch('/subscribe', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ subscription: subscription })
                    })
                    .then(response => {
                        if (response.ok) {
                            console.log('Подписка успешно отправлена на сервер.');
                        } else {
                            console.error('Ошибка ответа сервера:', response.statusText);
                        }
                    })
                    .catch(err => {
                        console.error('Ошибка сети:', err);
                    });
                })
                .catch(err => {
                    console.error('Ошибка при подписке:', err);
                });
        }
    </script>
</body>
</html>
